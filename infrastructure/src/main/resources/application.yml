server:
  port: 8080
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

spring:
  application:
    name: meowth
  profiles:
    default: development
  threads:
    virtual:
      enabled: true
  mongodb:
    uri: mongodb://${mongodb.username}:${mongodb.password}@${mongodb.host}/${mongodb.database}
    representation:
      uuid: java_legacy
  data:
    mongodb:
      auto-index-creation: true